name: CI

# ─────────────────────────────────────────────────────────────────────────────
# `pull_request.branches` FILTERS ON THE PR'S **BASE** REF, NOT ITS HEAD.
#
# Recorded because it has already cost one investigation. PRs #8 and #9 showed
# only Vercel/Railway checks and no CI matrix, which reads like a broken
# trigger. The trigger is fine. Those PRs were STACKED -- #9's base was
# `feature/arena-rtt-overhaul` and #8's base was `chore/production-deployment`,
# neither of which is `main` -- so `branches: [main]` did not match and no
# workflow run was created at all (`gh run list` shows none for either branch).
# PRs #7 and #10, both based on `main`, ran the full matrix.
#
# Vercel and Railway appear on every PR regardless of base because they are
# GitHub App integrations that fire on a branch push, not on a `pull_request`
# event with a base filter. That asymmetry is the entire effect.
#
# So: a PR targeting `main` runs everything below; a PR stacked onto another
# feature branch runs nothing. If stacked PRs should also get CI, widen the
# filter -- left to the repository owner as a deliberate decision, not applied
# here:
#
#     pull_request:
#       branches: [main, 'feature/**', 'chore/**']
#
# Separately: `main` currently has no branch protection, so every job below is
# ADVISORY -- it reports, but nothing blocks a merge on it.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for the default GITHUB_TOKEN, explicit rather than whatever
# the repository's default happens to be. `contents: read` is what
# actions/checkout needs on a private repo; `pull-requests: read` is what
# detect-changes' `gh api repos/.../pulls/.../files` call needs -- that
# endpoint is under the "pull requests" permission, not "contents". Nothing
# else in this file calls an authenticated GitHub API: upload-artifact and
# download-artifact use the separate Actions runtime token, and
# setup-python/setup-node/supabase's setup-cli download public releases.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Change detection ─────────────────────────────────────────────────────────
  #
  # WHY THIS EXISTS. Every job below used to run on every PR regardless of what
  # changed. Measured on a real green run (31748183221): Python model tests
  # alone cost 28 minutes and the four Playwright projects cost 72 combined --
  # unconditionally, on a docs tweak exactly as on a scoring change. That is the
  # majority of the Actions-minute budget this workflow spends.
  #
  # NO THIRD-PARTY ACTION. The PR's changed-file list comes straight from the
  # GitHub REST API via the built-in `gh` CLI and `GITHUB_TOKEN` -- no checkout,
  # no git history, no `dorny/paths-filter`-style dependency. `push`/
  # `workflow_dispatch` runs have no "base" to diff against, so they fall back
  # to running everything, which is also the safe default for a diff the script
  # could not compute for any other reason.
  #
  # scripts/ci/detect-changed-scope.sh is the ONE definition of the
  # classification, runnable and readable outside a workflow log; see its
  # header for exactly what routes into each scope and why "broad marker"
  # paths force the narrow Playwright projects on rather than trying to prove
  # a negative.
  detect-changes:
    name: Detect changed scope
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.scope.outputs.model }}
      api: ${{ steps.scope.outputs.api }}
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
      supabase: ${{ steps.scope.outputs.supabase }}
      feature_projects: ${{ steps.scope.outputs.feature_projects }}
    steps:
      # The ONLY thing this job needs from the repository is the classifier
      # itself. A cone-mode sparse checkout of scripts/ci (plus the root files
      # cone mode always includes) skips materialising ~500 apps/web files and
      # the committed parquet caches into a working tree nothing here reads.
      # No Node, no Python, no browsers -- see the note above about keeping
      # this job cheap. ubuntu-latest is retained deliberately: checkout + gh +
      # bash is guaranteed on it, and no cheaper GitHub-hosted Linux label is
      # confidently establishable for this repository.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/ci

      - name: Classify changed paths
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          files=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Deliberately NOT under `set -e`: a transient API failure here
            # (rate limit, hiccup) must fall through to files="" -- the same
            # conservative "run everything" default push/workflow_dispatch
            # already use -- rather than failing this step and, via the
            # implicit success() this job's dependents apply to `needs:
            # detect-changes`, silently skipping every check on the PR.
            if ! files="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate -q '.[].filename')"; then
              echo "::warning::Could not fetch the PR's changed-file list from the GitHub API; defaulting to running every check."
              files=""
            fi
          fi
          echo "Changed files (empty means push/dispatch/API-failure => run everything):"
          echo "$files"
          printf '%s\n' "$files" | scripts/ci/detect-changed-scope.sh | tee -a "$GITHUB_OUTPUT"

  # ── PR CORE PYTHON ────────────────────────────────────────────────────────────
  #
  # ONE runner for what used to be five: web-dataset build, board-generation
  # smoke, model tests, lineup model tests, FastAPI unit tests, and static
  # migration validation. Sequential on purpose -- see CLAUDE.md and each
  # script's own header for what each step checks; this job changes none of
  # that, only where it runs.
  #
  # Rebuilds data/web/ and data/game/ inline rather than sharing them via
  # upload/download-artifact. That is the SAME reasoning the old model-tests
  # job already used for itself ("the build reads committed leaderboard CSVs
  # and finishes in under a second, whereas a needs: would serialize this job
  # behind a slower one to fetch a file it can regenerate faster than it could
  # download") -- applied consistently to every job in this file that needs the
  # generated data, instead of only one of them.
  pr-core-python:
    name: Model, API, and data validation (Python)
    runs-on: ubuntu-latest
    needs: detect-changes
    # `!cancelled()` (rather than the implicit success()-only default) so a
    # push/workflow_dispatch run still gets the full job even if
    # detect-changes were to fail for some unrelated infra reason -- push and
    # dispatch are meant to run everything regardless of detect-changes'
    # outcome. On a PR, `needs.detect-changes.result == 'success'` still
    # requires it to have actually succeeded before trusting its `backend`
    # output; if it failed, the PR side of this OR is false and the job is
    # skipped (a crashed classifier should not run against unknown state, but
    # must also not silently take down push/dispatch coverage).
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.backend == 'true'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            apps/api/requirements.txt

      # One install for everything this job runs: the offline data build, the
      # model suite, the lineup suite, and the FastAPI unit suite.
      - name: Install model, build, and API dependencies
        run: pip install -r requirements.txt -r requirements-build.txt -r apps/api/requirements.txt

      - name: Build web dataset + card profiles v3
        run: scripts/ci/build-web-data.sh

      - name: Verify v3 metadata artifact exists
        run: test -f data/game/profiles/profile_metadata.v3.json || (echo "MISSING profile_metadata.v3.json" && exit 1)

      # ── The two expensive steps are individually change-gated ───────────
      #
      # This job stays ONE runner (see the header); what changed is that its
      # two costly steps no longer both run whenever either half of the job
      # has work. Measured on run 33099926334: `Run model tests` = 34.0 min,
      # `Run API unit tests` = 7.4 min, everything else in this job = 0.4 min
      # of setup and four sub-minute steps.
      #
      # `pytest tests/` cannot be affected by an `apps/api/` change -- nothing
      # under tests/ imports the API package -- so an API-only, Supabase-only
      # or CI-script-only PR used to pay 34 minutes for a suite its diff could
      # not break. scripts/ci/detect-changed-scope.sh's MODEL_PATTERN and
      # API_PATTERN document exactly what routes into each; every model path
      # also appears in API_PATTERN, because the dependency runs that way.
      #
      # NOT gated on push/workflow_dispatch: the leading `github.event_name !=
      # 'pull_request'` keeps main and manual runs unconditionally complete,
      # which is the whole point of main being the release safety net. The
      # steps carry no status-check function, so the implicit `success()` still
      # applies and a failure upstream still stops the job.
      - name: Run model tests
        # Same script `make test-model` runs. It re-checks the generated data
        # and refreshes the scored-cache mtime before pytest.
        if: github.event_name != 'pull_request' || needs.detect-changes.outputs.model == 'true'
        run: scripts/ci/model-tests.sh

      - name: Run lineup model tests
        if: github.event_name != 'pull_request' || needs.detect-changes.outputs.model == 'true'
        run: scripts/ci/lineup-tests.sh

      - name: Run API unit tests
        # The SAME script `make test-api` runs. Pins
        # PEAK3_TEST_REPOSITORY_MODE=memory and deselects every
        # supabase_integration test rather than running-and-skipping it; those
        # run for real in supabase-integration-local below.
        if: github.event_name != 'pull_request' || needs.detect-changes.outputs.api == 'true'
        run: scripts/ci/api-unit-tests.sh

      # Sub-minute both, and each is the only check of its kind in the
      # workflow. Left unconditional: gating them would save nothing and could
      # only lose coverage.
      - name: Board generation smoke check (225 seeds x 3 modes)
        run: python scripts/check_board_generation.py 75

      - name: Validate migrations and check inventory drift
        run: scripts/ci/migration-validate.sh

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck, lint, unit tests, production build)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.frontend == 'true'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # npm ci over npm install: deterministic from the committed lockfile,
        # and confirmed compatible (`npm ci --legacy-peer-deps --dry-run`
        # resolves cleanly against apps/web/package-lock.json).
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Typecheck, lint (zero warnings), unit tests, production build
        # One script, also run by `make verify-frontend`, so a developer cannot
        # satisfy a subset of what CI checks.
        run: scripts/ci/frontend-verify.sh
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Migration chain validation now runs inside pr-core-python; see that job. ──

  # ── Supabase / Postgres integration — LOCAL STACK, NO SECRETS ───────────────
  #
  # THE JOB THAT CONVERTS "never ran" INTO "always runs". The 95 tests in
  # apps/api/tests/integration/ plus test_repository_conformance.py's Postgres
  # half had never executed on any pull request: the only job that ran them
  # required hosted-project secrets that are not set, so it skipped all 95 and
  # reported success. This runs them for real, with no secrets.
  #
  # WHY NOT `services: postgres:17`. Measured, not assumed -- applying the
  # chain to a bare postgres:17 container fails on 19 of 35 migrations
  # (`schema "auth" does not exist`, `role "anon" does not exist`); nothing in
  # the chain creates those, Supabase provisions them. See
  # scripts/ci/supabase-local-integration.sh's header for the full argument.
  #
  # CHANGE-GATED, NOT ALWAYS-ON. Kept separate from pr-core-python because it
  # needs a materially different toolchain (the Supabase CLI + a local Postgres
  # stack, not just pip). Gated on a narrower "supabase" scope than the general
  # "backend" scope (RLS/auth/repositories/migrations only) rather than on
  # every apps/api/ change, per instruction C: an unrelated API change (e.g. a
  # Daily Grid rate limit) should not provision a Supabase stack.
  supabase-integration-local:
    name: Supabase/Postgres integration tests (local stack, no secrets)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.supabase == 'true'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # Both files this job actually installs. Keyed on apps/api's alone,
          # the cache did not invalidate when the root requirements.txt moved.
          cache-dependency-path: |
            requirements.txt
            apps/api/requirements.txt

      - name: Install model + API dependencies
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run the integration suite against a real database
        run: scripts/ci/supabase-local-integration.sh
        env:
          PEAK3_CI_SUPABASE_RESET: "1"

  # ── Playwright e2e + accessibility — PR TIER ─────────────────────────────────
  #
  # Two levels, per the repository's own trade-off: chromium-core (broad --
  # navigation, rankings, accessibility, daily, RTT, auth) and mobile-chrome
  # are cheap enough and general enough to run on every e2e-relevant PR.
  # chromium-multiplayer and chromium-courtbuilder are narrower and
  # individually expensive (9 and 20 minutes), so on a PR they run only when
  # `detect-changes` attributes the diff to their own feature paths (or to a
  # "broad marker" path where that attribution cannot be made safely -- see
  # scripts/ci/detect-changed-scope.sh). All four still run on every push to
  # main and via workflow_dispatch in playwright-full below, so coverage is
  # never silently dropped -- only deferred past the point a narrow PR touched
  # nothing outside its own lane.
  #
  # Both PR jobs `needs: frontend` so a PR that fails typecheck/lint/build does
  # not also burn 15-40 minutes running Playwright against a build that does
  # not compile. `needs.frontend.result != 'failure' && != 'cancelled'`
  # (combined with the leading `!cancelled()`, which overrides the implicit
  # success()-only default without also proceeding after a real cancellation)
  # lets the job proceed when frontend was SKIPPED (no frontend files changed)
  # rather than only when it succeeded -- GitHub Actions' default `needs:`
  # semantics skip a dependent job when its dependency is skipped, which would
  # silently drop E2E on every backend-only PR.
  playwright-pr-core:
    name: Playwright chromium-core + mobile-chrome (PR)
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.e2e == 'true' &&
      needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            apps/api/requirements.txt

      - name: Install model + build + API dependencies
        run: pip install -r requirements.txt -r requirements-build.txt -r apps/api/requirements.txt

      - name: Build web dataset + card profiles v3
        run: scripts/ci/build-web-data.sh

      - name: Verify v3 metadata artifact exists
        run: test -f data/game/profiles/profile_metadata.v3.json || (echo "MISSING profile_metadata.v3.json" && exit 1)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Assert the project split still covers every test
        run: scripts/ci/assert-e2e-inventory.sh

      - name: Run chromium-core (fresh services, 0 retries)
        run: scripts/ci/e2e-tests.sh --project=chromium-core
        env:
          CI: true
          PLAYWRIGHT_RETRIES: "0"

      - name: Run mobile-chrome (fresh services, 0 retries)
        # Sequential on the same runner, not a second matrix leg -- both
        # projects share the one Python/Node/Chromium setup above.
        run: scripts/ci/e2e-tests.sh --project=mobile-chrome
        env:
          CI: true
          PLAYWRIGHT_RETRIES: "0"

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-pr-core
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-pr-core
          path: apps/web/test-results/
          retention-days: 7

  playwright-pr-feature:
    name: Playwright ${{ matrix.project }} + axe (PR, path-gated)
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.feature_projects != '' &&
      needs.detect-changes.outputs.feature_projects != '[]' &&
      needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect-changes.outputs.feature_projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            apps/api/requirements.txt

      - name: Install model + build + API dependencies
        run: pip install -r requirements.txt -r requirements-build.txt -r apps/api/requirements.txt

      - name: Build web dataset + card profiles v3
        run: scripts/ci/build-web-data.sh

      - name: Verify v3 metadata artifact exists
        run: test -f data/game/profiles/profile_metadata.v3.json || (echo "MISSING profile_metadata.v3.json" && exit 1)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Assert the project split still covers every test
        run: scripts/ci/assert-e2e-inventory.sh

      - name: Run Playwright ${{ matrix.project }} (fresh services, 0 retries)
        run: scripts/ci/e2e-tests.sh --project=${{ matrix.project }}
        env:
          CI: true
          PLAYWRIGHT_RETRIES: "0"

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}
          path: apps/web/test-results/
          retention-days: 7

  # ── Playwright e2e + accessibility — FULL SUITE (main + manual) ─────────────
  #
  # All four projects, unconditionally. Runs on every push to main (so the
  # branch that deploys always has full E2E coverage, even for PRs that only
  # needed the narrow PR tier above) and on workflow_dispatch (so a risky PR
  # can get the full run on demand before merge). SAME structure the PR matrix
  # used to have: fail-fast:false for isolation, 0 retries, the same inventory
  # assertion -- moved to this trigger scope, not changed in kind.
  playwright-full:
    name: Playwright ${{ matrix.project }} + axe (full suite, 0 retries)
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend]
    if: |
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.frontend.result != 'failure' && needs.frontend.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-core, chromium-multiplayer, chromium-courtbuilder, mobile-chrome]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            apps/api/requirements.txt

      - name: Install model + build + API dependencies
        run: pip install -r requirements.txt -r requirements-build.txt -r apps/api/requirements.txt

      - name: Build web dataset + card profiles v3
        run: scripts/ci/build-web-data.sh

      - name: Verify v3 metadata artifact exists
        run: test -f data/game/profiles/profile_metadata.v3.json || (echo "MISSING profile_metadata.v3.json" && exit 1)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Assert the project split still covers every test
        run: scripts/ci/assert-e2e-inventory.sh

      - name: Run Playwright tests (fresh services, 0 retries)
        run: scripts/ci/e2e-tests.sh --project=${{ matrix.project }}
        env:
          CI: true
          PLAYWRIGHT_RETRIES: "0"

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-full-${{ matrix.project }}
          path: apps/web/test-results/
          retention-days: 7
