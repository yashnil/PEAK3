name: CI

# ─────────────────────────────────────────────────────────────────────────────
# `pull_request.branches` FILTERS ON THE PR'S **BASE** REF, NOT ITS HEAD.
#
# Recorded because it has already cost one investigation. PRs #8 and #9 showed
# only Vercel/Railway checks and no CI matrix, which reads like a broken
# trigger. The trigger is fine. Those PRs were STACKED -- #9's base was
# `feature/arena-rtt-overhaul` and #8's base was `chore/production-deployment`,
# neither of which is `main` -- so `branches: [main]` did not match and no
# workflow run was created at all (`gh run list` shows none for either branch).
# PRs #7 and #10, both based on `main`, ran the full matrix.
#
# Vercel and Railway appear on every PR regardless of base because they are
# GitHub App integrations that fire on a branch push, not on a `pull_request`
# event with a base filter. That asymmetry is the entire effect.
#
# So: a PR targeting `main` runs everything below; a PR stacked onto another
# feature branch runs nothing. If stacked PRs should also get CI, widen the
# filter -- left to the repository owner as a deliberate decision, not applied
# here:
#
#     pull_request:
#       branches: [main, 'feature/**', 'chore/**']
#
# Separately: `main` currently has no branch protection, so every job below is
# ADVISORY -- it reports, but nothing blocks a merge on it.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Model tests ─────────────────────────────────────────────────────────────
  model-tests:
    name: Python model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-model-${{ hashFiles('requirements.txt') }}

      - name: Install model dependencies
        run: pip install -r requirements.txt

      - name: Build the web dataset
        # `data/web/` is deliberately not committed (.gitignore, and CLAUDE.md
        # "Data export rules"), so a fresh checkout has no peak_windows.json —
        # and nba_peak/run_the_table/cards.py needs it to build the card pool.
        # Without this step every RUN THE TABLE test raises
        # CardPoolUnavailable: 210 errors, all one cause.
        #
        # The `web-dataset` job already builds this, but GitHub Actions jobs do
        # not share a filesystem. Rebuilding here rather than adding
        # `needs: web-dataset` + download-artifact is the cheaper option in
        # both senses: the build reads committed leaderboard CSVs and finishes
        # in under a second, whereas a `needs:` would serialize this job — one
        # of the fastest in the matrix — behind a slower one to fetch a file it
        # can regenerate faster than it could download.
        run: scripts/ci/build-web-data.sh

      - name: Run model tests
        # Same script `make test-model` runs. It re-checks the generated data
        # and refreshes the scored-cache mtime before pytest — see the script.
        run: scripts/ci/model-tests.sh

  # ── Lineup model tests ───────────────────────────────────────────────────────
  lineup-tests:
    name: Experimental lineup model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lineup-${{ hashFiles('requirements.txt') }}

      - name: Install model dependencies
        run: pip install -r requirements.txt

      - name: Run lineup model tests (need v3 profiles)
        run: |
          pip install pandas unidecode
          scripts/ci/build-web-data.sh
          scripts/ci/lineup-tests.sh

  # ── Data build + card profiles ───────────────────────────────────────────────
  web-dataset:
    name: Build web dataset + card profiles v3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas unidecode

      - name: Build web dataset + card profiles v3
        run: scripts/ci/build-web-data.sh

      - name: Verify v3 metadata artifact exists
        run: |
          test -f data/game/profiles/profile_metadata.v3.json || (echo "MISSING profile_metadata.v3.json" && exit 1)

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Upload game-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-data
          path: data/game/

  # ── Board generation smoke check ─────────────────────────────────────────────
  board-generation:
    name: Board generation smoke check (225 seeds × 3 modes)
    runs-on: ubuntu-latest
    needs: web-dataset
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Download game data
        uses: actions/download-artifact@v4
        with:
          name: game-data
          path: data/game/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: pip install -r requirements.txt

      - name: Smoke check 225 boards (75 seeds × 3 modes)
        run: python scripts/check_board_generation.py 75

  # ── FastAPI tests ────────────────────────────────────────────────────────────
  api-tests:
    name: FastAPI unit tests (in-memory repositories)
    runs-on: ubuntu-latest
    needs: web-dataset
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Download game data
        uses: actions/download-artifact@v4
        with:
          name: game-data
          path: data/game/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-api-${{ hashFiles('apps/api/requirements.txt') }}

      - name: Install model + API dependencies
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Run API unit tests
        # The SAME script `make test-api` runs, so "green locally" and "green
        # in CI" are claims about the same set of tests. It was not: the
        # Makefile ran `pytest tests/` while this ran it with two extra
        # selection flags.
        #
        # The script pins PEAK3_TEST_REPOSITORY_MODE=memory, which turns off
        # dotenv loading and drops any inherited PEAK3_DATABASE_URL, and the
        # resolved backend is asserted once at app startup. It also deselects
        # every `supabase_integration` test rather than running-and-skipping
        # it, so the skip count stays meaningful; those run for real in the
        # supabase-integration job below.
        run: scripts/ci/api-unit-tests.sh

  # ── Frontend unit tests + build ───────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck, lint, unit tests, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/web

      - name: Typecheck, lint (zero warnings), unit tests, production build
        # One script, also run by `make verify-frontend`, so a developer cannot
        # satisfy a subset of what CI checks.
        run: scripts/ci/frontend-verify.sh
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Playwright e2e + accessibility ───────────────────────────────────────────
  playwright:
    name: Playwright browser tests + axe accessibility (0 retries)
    runs-on: ubuntu-latest
    needs: [web-dataset, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Download game data
        uses: actions/download-artifact@v4
        with:
          name: game-data
          path: data/game/

      # Python + FastAPI
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip (API + model)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pw-${{ hashFiles('requirements.txt', 'apps/api/requirements.txt') }}

      - name: Install model + API dependencies
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      # Node + Next.js + Playwright
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # CI=true forces reuseExistingServer=false so Playwright always starts
      # its own services from the current working tree.
      - name: Run Playwright tests (fresh services, 0 retries)
        # The SAME script `make test-e2e` runs. Every feature flag the API
        # refuses to serve without now lives in that one file rather than
        # here, because the previous arrangement — flags in YAML, a second
        # partial set in apps/web/package.json's `start:api`, and none in the
        # Makefile — is how the job came to depend on values a developer had
        # no way to discover. The script's own header documents each one.
        #
        # It also preflights: ports 3000/8000 free, generated data present.
        # playwright.setup.ts then probes the running services, including that
        # the account surface actually renders — the check whose absence let a
        # clean checkout fail ten auth assertions 28 minutes in.
        run: scripts/ci/e2e-tests.sh
        env:
          CI: true
          PLAYWRIGHT_RETRIES: "0"

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  # ── Migration chain validation ───────────────────────────────────────────────
  #
  # `scripts/validate_migrations.py` and `scripts/migration_inventory.py` both
  # existed for several passes and were invoked by NOTHING — not this workflow,
  # not the Makefile, not another script. This is the caller. Static only (no
  # SQL is executed here); actually applying the chain is the
  # supabase-integration-local job below.
  migration-validate:
    name: Migration chain validation + inventory drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: both scripts are pure standard library. Adding a
      # dependency install here would make a 5-second check take a minute.

      - name: Validate migrations and check inventory drift
        run: scripts/ci/migration-validate.sh

  # ── Supabase / Postgres integration — LOCAL STACK, NO SECRETS ───────────────
  #
  # THE JOB THAT CONVERTS "never ran" INTO "always runs". The 95 tests in
  # apps/api/tests/integration/ plus test_repository_conformance.py's Postgres
  # half had never executed on any pull request: the only job that ran them
  # required hosted-project secrets that are not set, so it skipped all 95 and
  # reported success. This runs them for real, on every PR, with no secrets.
  #
  # WHY NOT `services: postgres:17`. Measured, not assumed: applying the chain
  # to a bare postgres:17 container fails on 19 of 35 migrations —
  # `schema "auth" does not exist` (every RLS migration) and `role "anon" does
  # not exist` (every GRANT/REVOKE migration). Nothing in the chain creates the
  # `auth` schema, `auth.uid()`, or the anon/authenticated/service_role roles;
  # Supabase provisions them. Faking them in a bootstrap file would point
  # test_rls_policies.py at a locally-invented `auth.uid()` and make it prove
  # that the fixture works. See scripts/ci/supabase-local-integration.sh's
  # header for the full argument.
  #
  # No `needs:` and no dataset download: verified that this suite does not read
  # data/web/ or data/game/profiles/ (it passes with neither present), so
  # serializing it behind web-dataset would buy nothing.
  supabase-integration-local:
    name: Supabase/Postgres integration tests (local stack, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('apps/api/requirements.txt') }}

      - name: Install model + API dependencies
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run the integration suite against a real database
        # PEAK3_CI_SUPABASE_RESET=1 opts into `supabase db reset`, which replays
        # supabase/migrations from scratch. Destructive by design and therefore
        # opt-in: free on a runner whose database was created seconds ago, and
        # never the default so the same script is safe to run on a laptop.
        #
        # The script asserts on the JUnit report that tests actually EXECUTED
        # (collected > 0, skipped == 0). pytest exits 0 on a fully-skipped run,
        # so an exit code alone cannot tell "everything passed" from "nothing
        # ran" — which is exactly how the hosted job below stayed green.
        run: scripts/ci/supabase-local-integration.sh
        env:
          PEAK3_CI_SUPABASE_RESET: "1"

  # ── Hosted Supabase test project — configured? ──────────────────────────────
  #
  # Exists only so the job below can carry a job-level `if:`. The `secrets`
  # context is not available in a job-level `if:`, so the presence check has to
  # happen in a step and be published as a job output.
  supabase-secrets-probe:
    name: Hosted Supabase test project configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required secrets
        id: check
        run: |
          if [ -z "${{ secrets.PEAK3_TEST_SUPABASE_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## :information_source: Hosted Supabase integration tests: NOT CONFIGURED"
              echo ""
              echo "PEAK3_TEST_SUPABASE_URL (and related test-project secrets) are not set in this repository/environment."
              echo "The dependent job is therefore SKIPPED, not passed."
              echo ""
              echo "The same 95 tests still run on every PR against a local stack in **Supabase/Postgres integration tests (local stack, no secrets)**, so this is a gap in hosted-project coverage only — not in coverage of the tests themselves."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Hosted Supabase integration tests not configured — dependent job will be skipped (not reported as a pass). The same tests run against a local stack on every PR."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Supabase integration tests (Phase 4.0 — hosted ranked release gate) ─────
  #
  # Requires a real, isolated Supabase test project. Never runs against a
  # shared/production project. Required as a status check specifically for
  # promoting a build to ranked closed alpha (see
  # docs/architecture/ADR-004-phase4-ranked.md section A and
  # docs/implementation/PHASE_4_0_REPORT.md); it is intentionally NOT required
  # for ordinary merges to main, since most contributors will not have
  # test-project secrets.
  #
  # WHAT CHANGED AND WHY. This job used to run unconditionally and gate each
  # step on `steps.check.outputs.configured == 'true'`, on the stated reasoning
  # that an always-running job makes the unconfigured state visible. In practice
  # it produced a GREEN CHECK NAMED "Supabase integration tests" that had run
  # zero tests — confirmed on run 30875554663, which finished in 5 seconds. A
  # check that tested nothing must not be visually identical to one that passed.
  #
  # The job-level `if:` below makes the unconfigured state render as SKIPPED
  # (grey) rather than success. Nothing about what the job RUNS when it is
  # configured has changed — same script, same env, same assertions.
  supabase-integration:
    name: Supabase integration tests (hosted ranked release gate)
    runs-on: ubuntu-latest
    needs: [web-dataset, supabase-secrets-probe]
    if: needs.supabase-secrets-probe.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model + API dependencies
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Run Supabase integration tests
        # test_repository_conformance.py's Postgres-half tests carry the same
        # supabase_integration marker as tests/integration/ (see that file's
        # module docstring) so they run for real here too, instead of being
        # permanently deselected everywhere.
        run: scripts/ci/api-integration-tests.sh
        env:
          PEAK3_TEST_SUPABASE_URL: ${{ secrets.PEAK3_TEST_SUPABASE_URL }}
          PEAK3_TEST_SUPABASE_ANON_KEY: ${{ secrets.PEAK3_TEST_SUPABASE_ANON_KEY }}
          PEAK3_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PEAK3_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          PEAK3_TEST_DATABASE_URL: ${{ secrets.PEAK3_TEST_DATABASE_URL }}
          PEAK3_TEST_SUPABASE_JWT_SECRET: ${{ secrets.PEAK3_TEST_SUPABASE_JWT_SECRET }}

      - name: Report final status
        if: always()
        run: |
          echo "RESULT: ran against a real hosted Supabase test project"
