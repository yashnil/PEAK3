name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Model tests ─────────────────────────────────────────────────────────────
  model-tests:
    name: Python model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-model-${{ hashFiles('requirements.txt') }}

      - name: Install model dependencies
        run: pip install -r requirements.txt

      - name: Build the web dataset
        # `data/web/` is deliberately not committed (.gitignore, and CLAUDE.md
        # "Data export rules"), so a fresh checkout has no peak_windows.json —
        # and nba_peak/run_the_table/cards.py needs it to build the card pool.
        # Without this step every RUN THE TABLE test raises
        # CardPoolUnavailable: 210 errors, all one cause.
        #
        # The `web-dataset` job already builds this, but GitHub Actions jobs do
        # not share a filesystem. Rebuilding here rather than adding
        # `needs: web-dataset` + download-artifact is the cheaper option in
        # both senses: the build reads committed leaderboard CSVs and finishes
        # in under a second, whereas a `needs:` would serialize this job — one
        # of the fastest in the matrix — behind a slower one to fetch a file it
        # can regenerate faster than it could download.
        run: scripts/ci/build-web-data.sh

      - name: Run model tests
        # Same script `make test-model` runs. It re-checks the generated data
        # and refreshes the scored-cache mtime before pytest — see the script.
        run: scripts/ci/model-tests.sh

  # ── Lineup model tests ───────────────────────────────────────────────────────
  lineup-tests:
    name: Experimental lineup model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lineup-${{ hashFiles('requirements.txt') }}

      - name: Install model dependencies
        run: pip install -r requirements.txt

      - name: Run lineup model tests (need v3 profiles)
        run: |
          pip install pandas unidecode
          scripts/ci/build-web-data.sh
          scripts/ci/lineup-tests.sh

  # ── Data build + card profiles ───────────────────────────────────────────────
  web-dataset:
    name: Build web dataset + card profiles v3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas unidecode

      - name: Build web dataset + card profiles v3
        run: scripts/ci/build-web-data.sh

      - name: Verify v3 metadata artifact exists
        run: |
          test -f data/game/profiles/profile_metadata.v3.json || (echo "MISSING profile_metadata.v3.json" && exit 1)

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Upload game-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-data
          path: data/game/

  # ── Board generation smoke check ─────────────────────────────────────────────
  board-generation:
    name: Board generation smoke check (225 seeds × 3 modes)
    runs-on: ubuntu-latest
    needs: web-dataset
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Download game data
        uses: actions/download-artifact@v4
        with:
          name: game-data
          path: data/game/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model dependencies
        run: pip install -r requirements.txt

      - name: Smoke check 225 boards (75 seeds × 3 modes)
        run: python scripts/check_board_generation.py 75

  # ── FastAPI tests ────────────────────────────────────────────────────────────
  api-tests:
    name: FastAPI unit tests (in-memory repositories)
    runs-on: ubuntu-latest
    needs: web-dataset
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Download game data
        uses: actions/download-artifact@v4
        with:
          name: game-data
          path: data/game/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-api-${{ hashFiles('apps/api/requirements.txt') }}

      - name: Install model + API dependencies
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Run API unit tests
        # The SAME script `make test-api` runs, so "green locally" and "green
        # in CI" are claims about the same set of tests. It was not: the
        # Makefile ran `pytest tests/` while this ran it with two extra
        # selection flags.
        #
        # The script pins PEAK3_TEST_REPOSITORY_MODE=memory, which turns off
        # dotenv loading and drops any inherited PEAK3_DATABASE_URL, and the
        # resolved backend is asserted once at app startup. It also deselects
        # every `supabase_integration` test rather than running-and-skipping
        # it, so the skip count stays meaningful; those run for real in the
        # supabase-integration job below.
        run: scripts/ci/api-unit-tests.sh

  # ── Frontend unit tests + build ───────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck, lint, unit tests, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/web

      - name: Typecheck, lint (zero warnings), unit tests, production build
        # One script, also run by `make verify-frontend`, so a developer cannot
        # satisfy a subset of what CI checks.
        run: scripts/ci/frontend-verify.sh
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Playwright e2e + accessibility ───────────────────────────────────────────
  playwright:
    name: Playwright browser tests + axe accessibility (0 retries)
    runs-on: ubuntu-latest
    needs: [web-dataset, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download dataset
        uses: actions/download-artifact@v4
        with:
          name: web-dataset
          path: data/web/

      - name: Download game data
        uses: actions/download-artifact@v4
        with:
          name: game-data
          path: data/game/

      # Python + FastAPI
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip (API + model)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pw-${{ hashFiles('requirements.txt', 'apps/api/requirements.txt') }}

      - name: Install model + API dependencies
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      # Node + Next.js + Playwright
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm install --legacy-peer-deps
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # CI=true forces reuseExistingServer=false so Playwright always starts
      # its own services from the current working tree.
      - name: Run Playwright tests (fresh services, 0 retries)
        # The SAME script `make test-e2e` runs. Every feature flag the API
        # refuses to serve without now lives in that one file rather than
        # here, because the previous arrangement — flags in YAML, a second
        # partial set in apps/web/package.json's `start:api`, and none in the
        # Makefile — is how the job came to depend on values a developer had
        # no way to discover. The script's own header documents each one.
        #
        # It also preflights: ports 3000/8000 free, generated data present.
        # playwright.setup.ts then probes the running services, including that
        # the account surface actually renders — the check whose absence let a
        # clean checkout fail ten auth assertions 28 minutes in.
        run: scripts/ci/e2e-tests.sh
        env:
          CI: true
          PLAYWRIGHT_RETRIES: "0"

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  # ── Supabase integration tests (Phase 4.0 — ranked release gate) ────────────
  #
  # Requires a real, isolated Supabase test project. Never runs against a
  # shared/production project. This job always runs (never a job-level
  # `if:` skip) so a missing-secrets state is always visibly reported in
  # the job log and summary as "not configured" — it must never look like
  # a silent skip that could be mistaken for a pass. Required as a status
  # check specifically for promoting a build to ranked closed alpha (see
  # docs/architecture/ADR-004-phase4-ranked.md section A and
  # docs/implementation/PHASE_4_0_REPORT.md); it is intentionally NOT
  # required for ordinary merges to main, since most contributors will not
  # have test-project secrets.
  supabase-integration:
    name: Supabase integration tests (ranked release gate)
    runs-on: ubuntu-latest
    needs: web-dataset
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        run: |
          if [ -z "${{ secrets.PEAK3_TEST_SUPABASE_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## :warning: Supabase integration tests: NOT CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "PEAK3_TEST_SUPABASE_URL (and related test-project secrets) are not set in this repository/environment." >> "$GITHUB_STEP_SUMMARY"
            echo "This is expected for ordinary PRs. It IS required, with secrets present, before promoting a build to ranked closed alpha." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Supabase integration tests skipped — not configured. Required (with secrets) for ranked release promotion, not for ordinary merges."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model + API dependencies
        if: steps.check.outputs.configured == 'true'
        run: |
          pip install -r requirements.txt
          pip install -r apps/api/requirements.txt

      - name: Run Supabase integration tests
        if: steps.check.outputs.configured == 'true'
        # test_repository_conformance.py's Postgres-half tests carry the same
        # supabase_integration marker as tests/integration/ (see that file's
        # module docstring) so they run for real here too, instead of being
        # permanently deselected everywhere.
        run: scripts/ci/api-integration-tests.sh
        env:
          PEAK3_TEST_SUPABASE_URL: ${{ secrets.PEAK3_TEST_SUPABASE_URL }}
          PEAK3_TEST_SUPABASE_ANON_KEY: ${{ secrets.PEAK3_TEST_SUPABASE_ANON_KEY }}
          PEAK3_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PEAK3_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          PEAK3_TEST_DATABASE_URL: ${{ secrets.PEAK3_TEST_DATABASE_URL }}
          PEAK3_TEST_SUPABASE_JWT_SECRET: ${{ secrets.PEAK3_TEST_SUPABASE_JWT_SECRET }}

      - name: Report final status
        if: always()
        run: |
          if [ "${{ steps.check.outputs.configured }}" != "true" ]; then
            echo "RESULT: not configured (expected outside ranked-release-promotion runs)"
          else
            echo "RESULT: ran against a real Supabase test project"
          fi
